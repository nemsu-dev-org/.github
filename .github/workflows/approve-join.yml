name: Approve Join Request

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  approve:
    if: >
      contains(github.event.comment.body, '/approve') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Invite requester to the org and close the issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_ADMIN_TOKEN }}
          script: |
            const body = context.payload.issue.body || '';

            // Issue form generates: "### GitHub Profile Link\n\nhttps://github.com/username"
            // Parse that section first; fall back to a plain regex for freeform issues.
            const formSection = body.match(/###\s*GitHub Profile Link\s*\n+([^\n]+)/i);
            const searchText = formSection ? formSection[1].trim() : body;
            const match = searchText.match(/github\.com\/([A-Za-z0-9-]+)/i);

            if (!match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "No GitHub username found in the issue body. Add the profile link, then run `/approve` again."
              });
              return;
            }

            const username = match[1];
            const orgName = 'nemsu-dev-org';

            try {
              const user = await github.rest.users.getByUsername({ username });
              await github.rest.orgs.createInvitation({
                org: orgName,
                invitee_id: user.data.id
              });
            } catch (err) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Invite failed for @${username}: ${err.message}. Send it manually from the org members page.`
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Invite sent to @${username}. Closing this issue.`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });